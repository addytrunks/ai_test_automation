services:
  postgres:
    image: postgres:16-alpine
    container_name: apitest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apitest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apitest"]
      interval: 5s
      timeout: 3s
      retries: 5

  vampi:
    image: erev0s/vampi:latest
    container_name: apitest-vampi
    environment:
      vulnerable: "1"
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import urllib.request
          try:
              with urllib.request.urlopen('http://localhost:5000/users/v1') as r:
                  if r.status == 200:
                      exit(0)
          except Exception:
              try:
                  urllib.request.urlopen('http://localhost:5000/createdb')
                  exit(0)
              except Exception:
                  exit(1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
