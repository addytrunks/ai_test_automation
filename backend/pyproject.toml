[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apitest-backend"
version = "0.1.0"
description = "AI-Assisted API Test Generation Platform — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128,<0.129",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<0.28",
    "structlog>=24",
    "prance>=25.4",
    "openapi-spec-validator>=0.8.5",
    "pyyaml>=6",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27,<0.28",
]
