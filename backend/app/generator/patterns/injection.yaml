description: >
  Generate injection tests (SQL, NoSQL, XSS) through user-controllable fields.
  The target API may reject (4xx) OR accept payloads on vulnerable endpoints.
  Use status_in for flexible status codes and body_not_contains to detect reflection
  or execution evidence. Prefer path/query injection when path params are strings.
anti_patterns:
  - "Do NOT assume the API always returns 422 — vulnerable APIs may return 200"
examples:
  - input: "Endpoint path: /users/v1/{username}, method: GET, params: [{name: username, in: path}]"
    output:
      name: "SQL injection via username path parameter"
      description: "Probes SQL injection in a path parameter — safe APIs return 4xx; vulnerable APIs must not expose DB errors"
      scenario_type: "injection"
      path_params: {"username": "' OR '1'='1"}
      expected_status: 404
      assertions:
        - {type: "status_in", expected: [400, 404, 422, 500]}
        - {type: "body_not_contains", expected: "syntax error"}
        - {type: "body_not_contains", expected: "SQL"}
  - input: "Endpoint path: /users, method: POST, body: {email: string, name: string}"
    output:
      name: "SQL injection via name field"
      description: "Probes SQL injection in a JSON body field"
      scenario_type: "injection"
      headers: {"Content-Type": "application/json"}
      body: {"email": "inject@test.com", "name": "'; DROP TABLE users; --"}
      expected_status: 422
      assertions:
        - {type: "status_in", expected: [400, 422, 500]}
        - {type: "body_not_contains", expected: "DROP TABLE"}
  - input: "Endpoint path: /search, method: GET, params: [{name: q, in: query}]"
    output:
      name: "XSS injection via search query"
      description: "Probes XSS payload in query string — response must not reflect raw script tags"
      scenario_type: "injection"
      query_params: {"q": "<script>alert('xss')</script>"}
      expected_status: 400
      assertions:
        - {type: "status_in", expected: [400, 422]}
        - {type: "body_not_contains", expected: "<script>"}
  - input: "Endpoint path: /users/login, method: POST, body: {username: string, password: string}"
    output:
      name: "NoSQL injection in login credentials"
      description: "Probes NoSQL operator injection — vulnerable APIs return 200 with a token"
      scenario_type: "injection"
      headers: {"Content-Type": "application/json"}
      body: {"username": "admin", "password": {"$gt": ""}}
      expected_status: 401
      assertions:
        - {type: "status_in", expected: [400, 401, 422]}
        - {type: "body_not_contains", expected: "auth_token"}
