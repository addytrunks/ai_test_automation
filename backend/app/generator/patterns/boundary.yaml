description: "Generate boundary value tests probing edge cases — empty strings, zero values, max lengths, and oversized inputs."
examples:
  - input: "Endpoint path: /users, method: POST, body: {email: string, age: int}"
    output:
      name: "Boundary test with age zero"
      description: "Verifies API behavior when age is set to 0"
      scenario_type: "boundary"
      headers: {"Content-Type": "application/json"}
      body: {"email": "boundary@test.com", "age": 0}
      expected_status: 400
      assertions:
        - {type: "status_in", expected: [400, 422]}
  - input: "Endpoint path: /users, method: POST, body: {email: string, age: int}"
    output:
      name: "Boundary test with extremely large age"
      description: "Verifies API behavior when age exceeds reasonable bounds"
      scenario_type: "boundary"
      headers: {"Content-Type": "application/json"}
      body: {"email": "boundary@test.com", "age": 999999999}
      expected_status: 422
      assertions:
        - {type: "status_in", expected: [400, 422]}
  - input: "Endpoint path: /users/{username}/email, method: PUT, body: {email: string}"
    output:
      name: "Boundary test with excessively long email"
      description: "Probes ReDoS or validation limits with an oversized email string"
      scenario_type: "boundary"
      headers: {"Content-Type": "application/json"}
      body: {"email": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@bbbbbbbbbbbbbbbbbbbbbbbbbbbb.com"}
      expected_status: 422
      assertions:
        - {type: "status_in", expected: [400, 422, 500]}
