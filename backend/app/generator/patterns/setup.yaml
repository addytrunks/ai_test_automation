description: "Generate setup tests that acquire authentication tokens required by other tests in the suite. Setup tests MUST be generated whenever the target endpoint requires a Bearer token. They execute before all other tests and populate the runtime context with live tokens via JSONPath extraction. The 'extract' field maps template variable names to JSONPath expressions that extract values from the response body. Setup tests for User A and User B must always be generated as a pair when BOLA tests are present."
examples:
  - input: "Endpoint path: /users/v1/login, method: POST, params: none, body: {username: string, password: string}, produces: auth_token"
    output:
      name: "Acquire User A token"
      description: "Logs in as User A and extracts the auth token into runtime context for use in subsequent authenticated tests"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/login"
      body: {"username": "user1", "password": "user1"}
      expected_status: 200
      extract: {"USER_A_TOKEN": "$.auth_token"}
      assertions:
        - {type: "status_eq", expected: 200}
        - {type: "json_path", target: "$.auth_token", op: "exists"}
  - input: "Endpoint path: /users/v1/login, method: POST, params: none, body: {username: string, password: string}, produces: auth_token"
    output:
      name: "Acquire User B token"
      description: "Logs in as User B and extracts the auth token into runtime context — required for BOLA tests where User A attempts to access User B's resources"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/login"
      body: {"username": "user2", "password": "user2"}
      expected_status: 200
      extract: {"USER_B_TOKEN": "$.auth_token", "USER_B_ID": "$.user.id"}
      assertions:
        - {type: "status_eq", expected: 200}
        - {type: "json_path", target: "$.auth_token", op: "exists"}
  - input: "Endpoint path: /users/v1/login, method: POST, params: none, body: {username: string, password: string}, produces: auth_token, admin account present"
    output:
      name: "Acquire Admin token"
      description: "Logs in as an admin user and extracts the token into runtime context for privilege escalation and admin-only endpoint tests"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/login"
      body: {"username": "admin", "password": "admin"}
      expected_status: 200
      extract: {"ADMIN_TOKEN": "$.auth_token"}
      assertions:
        - {type: "status_eq", expected: 200}
        - {type: "json_path", target: "$.auth_token", op: "exists"}