description: >
  Generate setup tests that create test users and acquire authentication tokens.
  Setup tests MUST follow a register-then-login sequence: first register the user
  (if the API has a registration endpoint), then log in to obtain a token. Each
  setup test MUST include the correct 'method' and 'path' fields pointing to the
  actual registration or login endpoint (NOT the target endpoint being tested).
  The 'extract' field maps template variable names to JSONPath expressions that
  pull values from the response body. The 'static_context' field defines static
  values (like usernames or emails used during registration) that other tests need.
  Setup tests execute before all other tests and populate the runtime context.

examples:
  - input: "Register endpoint: POST /users/v1/register, body: {username, password, email}. Login endpoint: POST /users/v1/login, body: {username, password}, produces: auth_token"
    output:
      name: "Register User A"
      description: "Creates User A account via the registration endpoint"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/register"
      body: {"username": "test_user_a", "password": "Password123!", "email": "usera@test.com"}
      expected_status: 200
      static_context: {"USER_A_ID": "test_user_a"}
      assertions:
        - {type: "status_eq", expected: 200}

  - input: "Login endpoint: POST /users/v1/login, body: {username, password}, produces: auth_token"
    output:
      name: "Acquire User A token"
      description: "Logs in as User A and extracts the auth token into runtime context"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/login"
      body: {"username": "test_user_a", "password": "Password123!"}
      expected_status: 200
      extract: {"USER_A_TOKEN": "$.auth_token"}
      assertions:
        - {type: "status_eq", expected: 200}
        - {type: "json_path", target: "$.auth_token", op: "exists"}

  - input: "Register endpoint: POST /users/v1/register, body: {username, password, email}. Login endpoint: POST /users/v1/login, body: {username, password}, produces: auth_token"
    output:
      name: "Register User B"
      description: "Creates User B account — required for BOLA tests where User A accesses User B resources"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/register"
      body: {"username": "test_user_b", "password": "Password123!", "email": "userb@test.com"}
      expected_status: 200
      static_context: {"USER_B_ID": "test_user_b"}
      assertions:
        - {type: "status_eq", expected: 200}

  - input: "Login endpoint: POST /users/v1/login, body: {username, password}, produces: auth_token"
    output:
      name: "Acquire User B token"
      description: "Logs in as User B and extracts the auth token into runtime context for BOLA tests"
      scenario_type: "setup"
      method: "POST"
      path: "/users/v1/login"
      body: {"username": "test_user_b", "password": "Password123!"}
      expected_status: 200
      extract: {"USER_B_TOKEN": "$.auth_token"}
      assertions:
        - {type: "status_eq", expected: 200}
        - {type: "json_path", target: "$.auth_token", op: "exists"}